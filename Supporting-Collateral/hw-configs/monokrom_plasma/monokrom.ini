CYCLE_TIME = 100
##### Monokrom Additions #####
CONFIG_FILE = custom_config.yml
# Machine type, used to set the VTK plot to a crosshair
JET = True
# QtPyVCP Specific Options
CONFIRM_EXIT = False
FULLSCREEN = True
KEYBOARD_JOG = True
# Hides the menu bar, if present
HIDE_MENU_BAR = True
# GCode yaml syntax file
GCODE_SYNTAX = gcode_syntax.yml
# MONOKROM USER BUTTONS
USER1_NAME=EXAMPLE USER 1
USER1_ACTION=testfn1.ngc
USER2_NAME=EXAMPLE USER 2
USER2_ACTION=testfn2.ngc
USER3_NAME=LASER OFF
USER3_ACTION=laser_off.ngc

[VTK]
# Path set based on a deb install. If necessary adjust path to suite your installation
SPINDLE = /usr/lib/python3/dist-packages/qtpyvcp/widgets/display_widgets/vtk_backplot/models/jet_tracking_crosshair.stl
#SPINDLE = /home/james/jet_tracking_crosshair.stl

##### Monokrom Addition - Machine Details #####
[PLASMAC]
DEBOUNCE                = TRUE
PRESSURE                = MPa
#MACHINE                 = A120
#MACHINE                 = Hypertherm 45
MACHINE                 = Cutskill 60
DEFAULT_CUTCHART        = 1
SLAT_TOP                = -130

[FILTER]
PROGRAM_EXTENSION = .ngc,.nc,.tap GCode File (*.ngc, *.nc, *.tap)
##### Monokrom Additions #####
ngc = plasma_gcode_preprocessor
nc  = plasma_gcode_preprocessor
tap = plasma_gcode_preprocessor


[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[PYTHON]
# code specific for this configuration	
PATH_PREPEND = ./python
# generic support code
PATH_APPEND=../../nc_files/remap_lib/python-stdglue

# import the following Python module
TOPLEVEL=./python/toplevel.py

# the higher the more verbose tracing of the Python plugin
LOG_LEVEL = 10


[RS274NGC]
PARAMETER_FILE = linuxcnc.var
RS274NGC_STARTUP_CODE = G21 G40 G49 G80 G90 G92.1 G94 G97 M52P1
##### Monokrom Adjusted for User Button Search Path #####
SUBROUTINE_PATH = ./:./user_buttons:../../nc_files
USER_M_PATH = ./:../../nc_files

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 1000000

[HMOT]
CARD0=hm2_7i76e.0

[HAL]
TWOPASS = ON
HALUI = halui
HALFILE = monokrom.hal
HALFILE = qtplasmac_comp.hal
HALFILE = custom.hal
HALFILE = xhc-whb04b-6.hal
##### Monokrom Adjusted #####
#HALFILE = joypad_preloader.hal
POSTGUI_HALFILE = custom_postgui.hal
SHUTDOWN = shutdown.hal

