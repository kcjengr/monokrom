POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 2.000000
INTRO_GRAPHIC = linuxcnc.gif
INTRO_TIME = 2
PROGRAM_PREFIX = /home/james/linuxcnc/nc_files
INCREMENTS = 10mm 1mm .1mm .05mm
