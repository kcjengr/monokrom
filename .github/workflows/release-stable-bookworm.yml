name: Release (stable, bookworm)

# Builds and publishes python3-monokrom for a tagged stable release.
# Replaces the buildbot's monokrom_pyqt5_{x86,arm64}_factory.py stable
# builders + do_apt_bookworm.sh/do_apt_stable.sh.
#
# debian/control is missing pybuild-plugin-pyproject, python3-poetry-core,
# and python3-qtpyvcp from Build-Depends even though it needs all three
# (pybuild can't even detect the build system without the first one) --
# installed explicitly below.

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: debian:bookworm
    steps:
      - name: Install build prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates build-essential devscripts dpkg-dev python3-pip \
            pybuild-plugin-pyproject python3-poetry-core

      - name: Add kcjengr/apt as a build-time package source
        run: |
          echo "deb [trusted=yes] https://raw.githubusercontent.com/kcjengr/apt/main/apt bookworm main" \
            > /etc/apt/sources.list.d/kcjengr.list
          apt-get update

      - name: Checkout source
        uses: actions/checkout@v7
        with:
          path: source
          fetch-depth: 0
          fetch-tags: true

      - name: Install package build-deps
        working-directory: source
        run: |
          apt-get build-dep -y .
          apt-get install -y python3-qtpyvcp

      - name: Create changelog entry
        working-directory: source
        env:
          EMAIL: james@snaggingpixels.com
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dch --create --distribution stable --package monokrom \
            --newversion "${VERSION}" "Stable version."

      - name: Build package
        working-directory: source
        env:
          DEB_BUILD_OPTIONS: nocheck
          PYBUILD_SYSTEM: pyproject
        run: dpkg-buildpackage -b -uc

      - name: Upload built package
        uses: actions/upload-artifact@v7
        with:
          name: monokrom-bookworm-${{ matrix.arch }}
          path: '*.deb'
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download built packages
        uses: actions/download-artifact@v8
        with:
          pattern: monokrom-bookworm-*
          path: debs
          merge-multiple: true

      - name: Checkout apt repo
        uses: actions/checkout@v7
        with:
          repository: kcjengr/apt
          path: apt-repo
          token: ${{ secrets.APT_REPO_TOKEN }}

      - name: Import GPG signing key
        run: echo "${{ secrets.APT_GPG_PRIVATE_KEY }}" | base64 -d | gpg --batch --import

      - name: Publish suite(s) and push (retries on concurrent-publish races)
        working-directory: apt-repo
        env:
          GPG_KEY_ID: 0CDFCCE0388CFA48
        run: |
          set -euo pipefail
          git config user.name "kcjengr-bot"
          git config user.email "actions@github.com"
          for attempt in 1 2 3 4 5; do
            mkdir -p "apt/pool/main/bookworm"
            cp ../debs/*.deb "apt/pool/main/bookworm/"
          ./scripts/publish-suite.sh bookworm bookworm amd64 arm64
          ./scripts/publish-suite.sh stable   bookworm amd64 arm64

            git add -A
            if git diff --cached --quiet; then
              echo "no changes to publish"
              exit 0
            fi
            git commit -m "Publish monokrom ${GITHUB_REF_NAME} (bookworm/stable)"
            if git push; then
              echo "published on attempt ${attempt}"
              exit 0
            fi
            echo "push rejected (attempt ${attempt}/5) -- another repo published to kcjengr/apt at the same time, re-syncing and retrying"
            branch="$(git rev-parse --abbrev-ref HEAD)"
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            sleep $(( (RANDOM % 8) + attempt * 2 ))
          done
          echo "::error::failed to push to kcjengr/apt after 5 attempts"
          exit 1
