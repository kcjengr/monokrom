name: Docs

on:
  push:
    branches: [pyside6]
    paths:
      - '.github/workflows/docs.yml'
      - 'docs/'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install sphinx myst-parser sphinx-rtd-theme linkify-it-py

      - name: Build documentation
        run: cd docs && make html

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages
          git worktree add ../pages origin/gh-pages

          # Replace the published tree with the fresh build, preserving .git.
          find ../pages -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +
          cp -a ./docs/_build/html/. ../pages/
          touch ../pages/.nojekyll

          cd ../pages
          git add -A
          if git diff --cached --quiet; then
            echo "documentation unchanged, nothing to publish"
            exit 0
          fi
          git commit -m "Deploy docs from ${GITHUB_SHA}"
          # git push origin HEAD:gh-pages
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git HEAD:gh-pages
