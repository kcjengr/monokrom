name: Release (develop, trixie-dev)

# Builds and publishes python3-monokrom on every push to pyside6.
# Replaces the buildbot's monokrom_pyside6_{x86,arm64}_dev_factory.py
# builders + do_apt_trixie_dev.sh.

on:
  push:
    branches:
      - pyside6

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: debian:trixie
    steps:
      - name: Install build prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates build-essential devscripts dpkg-dev python3-pip \
            pybuild-plugin-pyproject python3-poetry-core

      - name: Add kcjengr/apt as a build-time package source
        run: |
          echo "deb [trusted=yes] https://raw.githubusercontent.com/kcjengr/apt/main/apt trixie-dev main" \
            > /etc/apt/sources.list.d/kcjengr.list
          apt-get update

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: source
          fetch-depth: 0
          fetch-tags: true

      - name: Install package build-deps
        working-directory: source
        run: |
          apt-get build-dep -y .
          apt-get install -y python3-qtpyvcp

      - name: Create changelog entry
        working-directory: source
        env:
          EMAIL: james@snaggingpixels.com
        run: |
          LATEST_TAG="$(git describe --abbrev=0 --tags)"
          COUNT="$(git rev-list --count "${LATEST_TAG}..HEAD")"
          VERSION="${LATEST_TAG#v}-${COUNT}.dev"
          rm -f debian/changelog
          dch --create --distribution unstable --package monokrom \
            --newversion "${VERSION}" "Develop version."

      - name: Build package
        working-directory: source
        env:
          DEB_BUILD_OPTIONS: nocheck
          PYBUILD_SYSTEM: pyproject
        run: dpkg-buildpackage -b -uc

      - name: Upload built package
        uses: actions/upload-artifact@v4
        with:
          name: monokrom-trixie-dev-${{ matrix.arch }}
          path: '*.deb'
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          pattern: monokrom-trixie-dev-*
          path: debs
          merge-multiple: true

      - name: Checkout apt repo
        uses: actions/checkout@v4
        with:
          repository: kcjengr/apt
          path: apt-repo
          token: ${{ secrets.APT_REPO_TOKEN }}

      - name: Import GPG signing key
        run: echo "${{ secrets.APT_GPG_PRIVATE_KEY }}" | base64 -d | gpg --batch --import

      - name: Publish suite(s) and push (retries on concurrent-publish races)
        working-directory: apt-repo
        env:
          GPG_KEY_ID: 2DEC041F290DF85A
        run: |
          set -euo pipefail
          git config user.name "kcjengr-bot"
          git config user.email "actions@github.com"
          for attempt in 1 2 3 4 5; do
            mkdir -p "apt/pool/main/trixie-dev"
            cp ../debs/*.deb "apt/pool/main/trixie-dev/"
            ./scripts/publish-suite.sh trixie-dev trixie-dev amd64 arm64

            git add -A
            if git diff --cached --quiet; then
              echo "no changes to publish"
              exit 0
            fi
            git commit -m "Publish monokrom dev build ${{ github.sha }} (trixie-dev)"
            if git push; then
              echo "published on attempt ${attempt}"
              exit 0
            fi
            echo "push rejected (attempt ${attempt}/5) -- another repo published to kcjengr/apt at the same time, re-syncing and retrying"
            branch="$(git rev-parse --abbrev-ref HEAD)"
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            sleep $(( (RANDOM % 8) + attempt * 2 ))
          done
          echo "::error::failed to push to kcjengr/apt after 5 attempts"
          exit 1
