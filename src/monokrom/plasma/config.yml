# Core runtime-owned editor defaults. VCPs can override these in config files.
gcode_editor_style_defaults:
  background_color: "#16160e"
  text_color: "#ffee06"
  padding: 2
  font_family: "Noto Sans Mono"
  font_point_size: 11
  font_style: normal
  font_weight: 400
  border_radius: 2

  line_number_area_background: "#505050"
  line_number_area_color: "#ffee06"
  line_number_font_family: "Noto Sans"
  line_number_font_point_size: 10
  line_number_font_weight: 400
  line_number_font_italic: false

  current_line_highlight_enabled: true
#  current_line_background: "{{ '#6c6ef0' if effective_theme_color('DISPLAY', 'THEME_COLOR', 'light') == 'dark' else '#bfc8ff' }}"
#  current_line_color: "{{ '#ffffff' if effective_theme_color('DISPLAY', 'THEME_COLOR', 'light') == 'dark' else '#000000' }}"
  current_line_background: "#ffee06"
  current_line_color: "#16160e"
  find_highlight_background: "{{ '#2848b9' if effective_theme_color('DISPLAY', 'THEME_COLOR', 'light') == 'dark' else '#9db6ff' }}"
  find_highlight_text: "{{ '#ffffff' if effective_theme_color('DISPLAY', 'THEME_COLOR', 'light') == 'dark' else '#000000' }}"
  find_error_background: "#ff0000"
  find_error_text: "#ffffff"
  find_status_background: "{{ '#5a5a5a' if effective_theme_color('DISPLAY', 'THEME_COLOR', 'light') == 'dark' else '#b7b7b7' }}"
  find_status_text: "{{ '#ffffff' if effective_theme_color('DISPLAY', 'THEME_COLOR', 'light') == 'dark' else '#000000' }}"
  find_status_border: "{{ '#5f5f5f' if effective_theme_color('DISPLAY', 'THEME_COLOR', 'light') == 'dark' else '#8f8f8f' }}"

# Core syntax profile consumed by VCPMainWindow runtime apply logic.
gcode_syntax_profile:
  version: 1
  model: flat-token-groups
  default_color: "{{ '#ffffff' if effective_theme_color('DISPLAY', 'THEME_COLOR', 'light') == 'dark' else '#000000' }}"
  syntax_styles:
    - id: Syntax_style_1
      setting: gcode-syntax.user-color-1
      tokens: [G]
    - id: Syntax_style_2
      setting: gcode-syntax.user-color-2
      tokens: [M]
    - id: Syntax_style_3
      setting: gcode-syntax.user-color-3
      tokens: [X, Y, Z, A, B, C, U, V, W, I, J, K, R, Q, P, F]
    - id: Syntax_style_4
      setting: gcode-syntax.user-color-4
      tokens: [number]
    - id: Syntax_style_5
      setting: gcode-syntax.user-color-5
      tokens: [semicolon, parenthesis, comment]
    - id: Syntax_style_6
      setting: gcode-syntax.user-color-6
      tokens: [single_quote, double_quote, string]

